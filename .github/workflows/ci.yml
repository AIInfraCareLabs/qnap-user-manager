name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check qnap_sdk tests examples scripts
      - run: python -m ruff check qnap_sdk tests examples scripts
      - run: python scripts/check_release.py
      - run: python tests/run_regression.py
      - run: python -m pytest --cov=qnap_sdk --cov-report=term-missing

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_release.py --dist dist
      - name: Install wheel outside source tree
        shell: bash
        run: |
          wheel=$(realpath dist/*.whl)
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --no-deps "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -I -c 'import qnap_sdk; assert qnap_sdk.get_profile()["firmware"] == qnap_sdk.DEFAULT_FIRMWARE'
          "$RUNNER_TEMP/wheel-check/bin/qnap-manager" --version
          "$RUNNER_TEMP/wheel-check/bin/qnap-manager" profiles
          "$RUNNER_TEMP/wheel-check/bin/qnap-manager" contracts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
