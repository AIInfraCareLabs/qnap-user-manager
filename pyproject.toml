[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnap-user-manager"
version = "0.4.0"
description = "Firmware-verified QNAP user, group, shared-folder and permission management SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["qnap", "nas", "qts", "sdk", "user-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/AIInfraCareLabs/qnap-user-manager"
Repository = "https://github.com/AIInfraCareLabs/qnap-user-manager"
Issues = "https://github.com/AIInfraCareLabs/qnap-user-manager/issues"

[project.optional-dependencies]
dev = ["build>=1", "twine>=5", "ruff>=0.9", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
qnap-manager = "qnap_sdk.cli:main"
qnap-dashboard = "qnap_sdk.dashboard:main"

[tool.setuptools.packages.find]
include = ["qnap_sdk*"]

[tool.setuptools.package-data]
qnap_sdk = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
